# Read about fixtures at http://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# password_digest is hashed by ERB with BCrypt at load time (#110, the
# has_secure_password replacement for Devise). Cost 4 keeps the fixture suite
# fast; every fixture user's password is "password".

<% PASSWORD_DIGEST = BCrypt::Password.create("password", cost: 4).to_s %>

john:
  username: "john"
  email: "john@example.com"
  password_digest: <%= PASSWORD_DIGEST %>
  role: 'admin'

bob:
  username: "bob"
  email: "bob@example.com"
  password_digest: <%= PASSWORD_DIGEST %>
  role: 'editor'
